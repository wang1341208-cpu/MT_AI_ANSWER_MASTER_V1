name: Build MT AI ANSWER MASTER APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -q MT_AI_ANSWER_MASTER_V1_BuildReady.zip -d source

      - name: Build debug APK
        working-directory: source/MT_AI_ANSWER_MASTER_V1_BuildReady
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MT-AI-ANSWER-MASTER-V1-debug
          path: source/MT_AI_ANSWER_MASTER_V1_BuildReady/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
